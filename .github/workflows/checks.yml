name: Evidence ledger checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate and export the training example
        run: |
          python -m regnav_evidence validate examples/synthetic_ledger.json --json
          python -m regnav_evidence report examples/synthetic_ledger.json --format markdown --output /tmp/regnav-example.md
          python -m regnav_evidence report examples/synthetic_ledger.json --format csv --output /tmp/regnav-example.csv
