name: Evidence ledger checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install optional document and spreadsheet parsers
        run: python -m pip install '.[pdf,tables,excel,test]'
      - name: Exercise optional parsers and workbench integration
        run: |
          python -m unittest tests.test_esg_ingest tests.test_esg_tabular tests.test_esg_workflow -v
          python examples/esg/make_demo.py /tmp/regnav-demo-input
          python -m regnav_esg run /tmp/regnav-demo-input/fictional_2024.pdf /tmp/regnav-demo-input/fictional_2025.pdf --output /tmp/regnav-demo-output --source-url https://example.org/fictional-2024 --source-url https://example.org/fictional-2025 --jurisdiction FICTIONAL
          python -m regnav_evidence validate /tmp/regnav-demo-output/ledger.json --json
          python -m regnav_esg inventory examples/esg/inventory.json
          python -m regnav_esg materiality examples/esg/materiality.json
          python -m regnav_esg plan examples/esg/plan.json
      - name: Validate and export the training example
        run: |
          python -m regnav_evidence validate examples/synthetic_ledger.json --json
          python -m regnav_evidence report examples/synthetic_ledger.json --format markdown --output /tmp/regnav-example.md
          python -m regnav_evidence report examples/synthetic_ledger.json --format csv --output /tmp/regnav-example.csv
      - name: Validate and export the unreviewed Singapore case
        run: |
          python -m regnav_evidence validate cases/singapore-sustainability-reporting/ledger.json --json
          python -m regnav_evidence report cases/singapore-sustainability-reporting/ledger.json --format markdown --output /tmp/regnav-sgx-case.md
          python -m regnav_evidence report cases/singapore-sustainability-reporting/ledger.json --format csv --output /tmp/regnav-sgx-case.csv
