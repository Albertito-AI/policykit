name: Agent interoperability
description: Propose or report a non-confidential check with an independently operated client.
title: "[Agent integration] "
body:
  - type: markdown
    attributes:
      value: |
        Use this public form for synthetic technical interoperability only. The current gateway is local MCP stdio, not a hosted marketplace or A2A service. Do not post credentials, private paths, client/student data, manuscripts or commercial terms. Existing RIGHTS.md remains controlling; this form grants no execution licence, partnership or permission to act for another operator.
  - type: dropdown
    id: stage
    attributes:
      label: What are you reporting?
      options:
        - Proposed check, not yet run
        - Observed result from an authorised check
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: Give the client/software name and protocol version. A public project link is optional; no private endpoint or account identifier.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Fictional task and expected result
      description: Identify the supplied example, expected behaviour and why this integration would help. Do not claim untested outcomes.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Actual observation or unresolved requirement
      description: For a proposed check, say it has not run. Otherwise give sanitised steps, result, help needed and any limitation. Use only material you are authorised to disclose.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Public submission boundaries
      options:
        - label: I am authorised to describe this client or proposal and have included no confidential data or credentials.
          required: true
        - label: I understand that this issue does not grant an executable licence, establish a partnership or authorise any payment or external delegation.
          required: true
