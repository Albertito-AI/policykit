name: Reproducible bug
description: Report an observed software problem with a small synthetic reproduction.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Describe behaviour you actually observed. Read CONTRIBUTING.md and RIGHTS.md in the repository root.
        Use the supplied fictional fixtures or a small synthetic replacement.
        Do not include personal, student or client data, private manuscripts, credentials or identifying paths.
        The training fixture intentionally produces three warnings; a warning alone is not a software defect.
  - type: input
    id: environment
    attributes:
      label: Software and environment
      description: Give the RegNav version or commit, Python version and operating system. State unknown where necessary.
      placeholder: "RegNav version/commit; Python version; operating system"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and observed problem
      description: What were you trying to do, and at which step did the problem occur?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include exact commands and the repository fixture path, or a minimal synthetic input. Say whether the problem repeats.
      placeholder: |
        1. Start from the repository root with this input:
        2. Run:
        3. Observe:
        Reproduced again: yes / no / not attempted
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Explain the expected result and the relevant documented behaviour, if any.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include relevant output and the exit code if known. Remove identifying paths and private information before pasting logs.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround or additional evidence
      description: Optional. Describe only workarounds or checks actually tried, with their results.
    validations:
      required: false
  - type: checkboxes
    id: public_content
    attributes:
      label: Public-content check
      options:
        - label: I have removed personal, student and client data, private manuscript content, credentials and identifying local paths.
          required: true
